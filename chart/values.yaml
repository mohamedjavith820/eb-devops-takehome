replicaCount: 2

image:
  repository: demo-svc
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: demo-app
  version: "1.0.0"

containerPort: 8080

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  host: demo.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
